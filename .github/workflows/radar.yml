name: Profile cards

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/projects.json"
      - "assets/portrait-dark.svg"
      - "assets/portrait-light.svg"
      - "scripts/cards.py"
      - "scripts/profile_banner.py"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Terminal banners
        run: python scripts/profile_banner.py
      - name: Personal account cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/cards.py --user leeansilva --projects assets/projects.json --out assets
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner-dark.svg assets/banner-light.svg assets/card-*.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile assets"
          git push
